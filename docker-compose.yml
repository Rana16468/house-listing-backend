version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: ts_express_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass mySecret123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mySecret123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: ts_express_backend
    restart: always
    ports:
      - "5000:5000" # 👈 হোস্ট ও কন্টেইনার দুটোই 5000
    environment:
      DATABASE_URL: "postgresql://postgres.jkjcfgjoeijmphlrsolj:tAyuxQf3BSfjZHNv@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true&statement_cache_size=0&sslmode=require"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "mySecret123"
      NODE_ENV: "development"
      PORT: 5000 # 👈 5060 পরিবর্তন করে 5000 করা হয়েছে
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy