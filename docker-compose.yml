services:
  redis:
    image: redis:7-alpine
    container_name: ts_express_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass mySecret123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mySecret123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: ts_express_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mongodb+srv://rishabhbhard:7eKDwOTRnV56UIti@cluster0.zmt3m.mongodb.net/rishabhbhard"
      DIRECT_URL: "mongodb+srv://rishabhbhard:7eKDwOTRnV56UIti@cluster0.zmt3m.mongodb.net/rishabhbhard"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "mySecret123"
      REDIS_URL: "redis://:mySecret123@redis:6379"
      NODE_ENV: "development"
      PORT: 5000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy